name: Daily News & Trends Fetcher

on:
  # يومياً الساعة 04:00 UTC = 07:00 صباحاً بتوقيت السعودية (UTC+3)
  schedule:
    - cron: '0 4 * * *'
  # تشغيل يدوي لاختبار السكربت فوراً من تبويب Actions
  workflow_dispatch:
    inputs:
      wipe:
        description: 'مسح مجموعات الأخبار قبل التشغيل'
        type: boolean
        default: false
      tweet:
        description: 'نشر تغريدة اليوم على X بعد الجلب'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-news-fetcher
  cancel-in-progress: false

jobs:
  fetch-news:
    name: جلب الأخبار والترندات وتلخيصها وتخزينها
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v7

      - name: إعداد Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: تثبيت الاعتماديات
        working-directory: scripts
        run: npm ci

      - name: تشغيل جالب الأخبار والترندات
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WIPE_FIRST: ${{ inputs.wipe }}
          MAX_ITEMS_PER_FEED: '8'
          MAX_PUBLISHED: '8'
          FETCH_IMAGES: 'true'
        run: node fetch_all.js

      - name: نشر تغريدة اليوم على X
        working-directory: scripts
        if: ${{ github.event_name == 'schedule' || inputs.tweet == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_PROFILE_URL: ${{ vars.X_PROFILE_URL }}
        run: node post_tweet.js
