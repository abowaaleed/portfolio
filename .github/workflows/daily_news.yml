name: Daily Tech News Fetcher

on:
  # يومياً الساعة 04:00 UTC = 07:00 صباحاً بتوقيت السعودية (UTC+3)
  schedule:
    - cron: '0 4 * * *'
  # تشغيل يدوي لاختبار السكربت فوراً من تبويب Actions
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-news-fetcher
  cancel-in-progress: false

jobs:
  fetch-news:
    name: جلب الأخبار وتلخيصها وتخزينها
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: تثبيت الاعتماديات
        working-directory: scripts
        run: npm ci

      - name: تشغيل جالب الأخبار
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node fetch_news.js
